<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Nova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="siteHeader"></div>
<main>
  <section class="page-hero compact"><span class="eyebrow">SECURE CHECKOUT</span><h1>Almost <em>yours.</em></h1></section>
  <section class="checkout-layout">
    <form id="checkoutForm" class="checkout-form">
      <div class="steps"><span class="active">01 Shipping</span><span>02 Payment</span><span>03 Review</span></div>
      <h2>Shipping information</h2>
      <div class="form-grid"><label>First name<input required placeholder="Shaahir"></label><label>Last name<input required placeholder="Khan"></label></div>
      <label>Email<input type="email" required placeholder="you@example.com"></label>
      <label>Phone<input type="tel" required placeholder="+91 9876543210"></label>
      <label>Address<textarea required placeholder="Street, building, apartment"></textarea></label>
      <div class="form-grid"><label>City<input required placeholder="Tiruchirappalli"></label><label>PIN code<input required pattern="[0-9]{6}" placeholder="620001"></label></div>
      <h2>Payment</h2>
      <label class="payment-card"><input type="radio" name="payment" checked> <span><b>Cash on Delivery</b><small>Pay when your order arrives</small></span></label>
      <label class="payment-card"><input type="radio" name="payment"> <span><b>UPI / Card</b><small>Demo checkout for portfolio use</small></span></label>
      <button class="btn btn-dark full" type="submit">Place order ↗</button>
    </form>
    <aside class="summary-card"><span class="eyebrow">YOUR BAG</span><div id="checkoutItems"></div><div class="sum-row total"><span>Total</span><b id="checkoutTotal">₹0</b></div></aside>
  </section>
</main>
<div id="siteFooter"></div><div id="toast"></div>
<script src="js/products.js"></script><script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const cart=getCart(), box=document.getElementById("checkoutItems");
  if(!cart.length){box.innerHTML='<p class="muted">Your bag is empty.</p>';document.getElementById("checkoutForm").style.display="none";return;}
  let total=0;
  box.innerHTML=cart.map(i=>{const p=products.find(x=>x.id===i.id);if(!p)return "";total+=p.price*i.quantity;return `<div class="mini-item"><img src="${p.image}" alt=""><span>${p.name}<small>Qty ${i.quantity}</small></span><b>₹${(p.price*i.quantity).toLocaleString()}</b></div>`}).join("");
  document.getElementById("checkoutTotal").textContent=`₹${total.toLocaleString()}`;
  document.getElementById("checkoutForm").addEventListener("submit",e=>{
    e.preventDefault();
    saveCart([]); updateCartCount();
    document.body.insertAdjacentHTML("beforeend",'<div class="success-modal"><div><div class="success-check">✓</div><span class="eyebrow">ORDER CONFIRMED</span><h2>You are all set.</h2><p>This is a portfolio demo checkout. No real payment was processed.</p><a class="btn btn-dark" href="index.html">Back to Nova ↗</a></div></div>');
  });
});
</script>
</body>
</html>
